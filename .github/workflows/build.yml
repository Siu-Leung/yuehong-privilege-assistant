name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install Components
        run: |
          SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager | sort -V | tail -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER --install "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.22.1" || true
          $SDKMANAGER --install "platforms;android-37" || $SDKMANAGER --install "platforms;android-36" || true

      - name: Prepare server.properties
        run: |
          if [ ! -f server.properties ]; then
            cp server.properties.example server.properties
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :manager:assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          find . -path "*/outputs/apk/*.apk" -exec cp -v {} dist/ \;
          if [ -d out/apk ]; then cp -v out/apk/*.apk dist/ 2>/dev/null || true; fi
          ls -lh dist/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuehong-privilege-assistant-debug
          path: dist/*.apk
          retention-days: 14
